server:
  port: 8081

spring:
  datasource:
    # Add the connection timezone parameter at the end of the URL
    url: jdbc:postgresql://localhost:5432/moviebooking
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA must be aligned with 'datasource', NOT inside it
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect