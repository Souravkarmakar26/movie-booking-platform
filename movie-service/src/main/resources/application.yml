server:
  port: 8081

spring:
  application:
    name: movie-service

  datasource:
    url: jdbc:postgresql://localhost:5432/movie_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

#  kafka:
#    consumer:
#      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
#    properties:
#      properties:
#        spring.json.trusted.packages: "*"

  management:
    tracing:
      sampling:
        probability: 1.0
    endpoints:
      web:
        exposure:
          include: health,info,metrics,loggers

      endpoint:
        health:
          show-details: always

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4318

  logging:
    correlation:
      enabled: true
    pattern:
      level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"